name: 'gitRelease Action'
description: 'Create, update, and manage GitHub releases using gitRelease CLI tool'
branding:
  icon: 'tag'
  color: 'blue'

inputs:
  command:
    description: 'Command to execute (github create, github update, github upload, version next, etc.)'
    required: true
  token:
    description: 'GitHub token for authentication (usually secrets.GITHUB_TOKEN)'
    required: false
    default: ${{ github.token }}
  server:
    description: 'Gitea server address (required) or Github Enterprise server address (optional)'
    required: false
  owner:
    description: 'Repository owner (defaults to current repository owner)'
    required: false
    default: ${{ github.repository_owner }}
  repo:
    description: 'Repository name (defaults to current repository name)'
    required: false
    default: ${{ github.event.repository.name }}
  tag:
    description: 'Tag name for the release'
    required: false
  name:
    description: 'Release name'
    required: false
  body:
    description: 'Release body/description'
    required: false
  prerelease:
    description: 'Mark as prerelease (true/false)'
    required: false
    default: 'false'
  draft:
    description: 'Mark as draft (true/false)'
    required: false
    default: 'false'
  file:
    description: 'File path to upload as asset'
    required: false
  label:
    description: 'Label for the asset'
    required: false

outputs:
  result:
    description: 'Command execution result'
    value: ${{ steps.gitrelease.outputs.result }}

runs:
  using: 'composite'
  steps:
    - name: Execute gitRelease
      id: gitrelease
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        # Build command with proper escaping
        ARGS="${{ inputs.command }}"
        
        # Add Token
        if [ -n "${{ inputs.token }}" ]; then
          ARGS="$ARGS --ApiToken '${{ inputs.token }}'"
        fi

        # Add server
        if [ -n "${{ inputs.server }}" ]; then
          ARGS="$ARGS --server '${{ inputs.server }}'"
        fi

        # Add owner
        if [ -n "${{ inputs.owner }}" ]; then
          ARGS="$ARGS --owner '${{ inputs.owner }}'"
        fi
        
        # Add repo
        if [ -n "${{ inputs.repo }}" ]; then
          ARGS="$ARGS --repo '${{ inputs.repo }}'"
        fi
        
        # Add tag
        if [ -n "${{ inputs.tag }}" ]; then
          ARGS="$ARGS --tag '${{ inputs.tag }}'"
        fi
        
        # Add name
        if [ -n "${{ inputs.name }}" ]; then
          ARGS="$ARGS --name '${{ inputs.name }}'"
        fi
        
        # Add body
        if [ -n "${{ inputs.body }}" ]; then
          ARGS="$ARGS --body '${{ inputs.body }}'"
        fi
        
        # Add prerelease flag
        if [ "${{ inputs.prerelease }}" = "true" ]; then
          ARGS="$ARGS --prerelease"
        fi
        
        # Add draft flag
        if [ "${{ inputs.draft }}" = "true" ]; then
          ARGS="$ARGS --draft"
        fi
        
        # Add file
        if [ -n "${{ inputs.file }}" ]; then
          ARGS="$ARGS --filename '${{ inputs.file }}'"
        fi
        
        # Add label
        if [ -n "${{ inputs.label }}" ]; then
          ARGS="$ARGS --label '${{ inputs.label }}'"
        fi

        # Add verbose flag if GitHub Actions step debug is enabled
        if [ "${{ runner.debug }}" = "1" ] || [ "$ACTIONS_STEP_DEBUG" = "true" ]; then
          ARGS="$ARGS -v"
        fi
        
        # Execute command directly in the checked-out repository
        # Use docker with mounted workspace
        echo "Executing: docker run --rm -e GITHUB_TOKEN -v ${{ github.workspace }}:/workspace craftingit/gitrelease:2 $ARGS"
        docker run --rm \
          -e GITHUB_TOKEN="${{ inputs.token }}" \
          -v ${{ github.workspace }}:/workspace \
          craftingit/gitrelease:2.0.16 \
          $ARGS
