name: 'gitRelease Action'
description: 'Create, update, and manage GitHub releases using gitRelease CLI tool'
branding:
  icon: 'tag'
  color: 'blue'

inputs:
  command:
    description: 'Command to execute (github create, github update, github upload, version next, etc.)'
    required: true
  token:
    description: 'GitHub token for authentication (usually secrets.GITHUB_TOKEN)'
    required: true
  server:
    description: 'Gitea server address (required) or Github Enterprise server address (optional)'
    required: false
  owner:
    description: 'Repository owner (defaults to current repository owner)'
    required: false
    default: ${{ github.repository_owner }}
  repo:
    description: 'Repository name (defaults to current repository name)'
    required: false
    default: ${{ github.event.repository.name }}
  tag:
    description: 'Tag name for the release'
    required: false
  name:
    description: 'Release name'
    required: false
  body:
    description: 'Release body/description'
    required: false
  prerelease:
    description: 'Mark as prerelease (true/false)'
    required: false
    default: 'false'
  draft:
    description: 'Mark as draft (true/false)'
    required: false
    default: 'false'
  file:
    description: 'File path to upload as asset'
    required: false
  label:
    description: 'Label for the asset'
    required: false

outputs:
  result:
    description: 'Command execution result'
    value: ${{ steps.gitrelease.outputs.result }}

runs:
  using: 'composite'
  steps:
    - name: Execute gitRelease
      id: gitrelease
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        # Build command
        CMD="docker run --rm \
          -e GITHUB_TOKEN=${{ inputs.token }} \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          craftingit/gitrelease:latest \
          ${{ inputs.command }}"
        
        # Add Token
        if [ -n "${{ inputs.token }}" ]; then
          CMD="$CMD --ApiToken '${{ inputs.token }}'"
        fi

        # Add server
        if [ -n "${{ inputs.server }}" ]; then
          CMD="$CMD --server '${{ inputs.server }}'"
        fi

        # Add owner
        if [ -n "${{ inputs.owner }}" ]; then
          CMD="$CMD --owner '${{ inputs.owner }}'"
        fi
        
        # Add repo
        if [ -n "${{ inputs.repo }}" ]; then
          CMD="$CMD --repo '${{ inputs.repo }}'"
        fi
        
        # Add tag
        if [ -n "${{ inputs.tag }}" ]; then
          CMD="$CMD --tag '${{ inputs.tag }}'"
        fi
        
        # Add name
        if [ -n "${{ inputs.name }}" ]; then
          CMD="$CMD --name '${{ inputs.name }}'"
        fi
        
        # Add body
        if [ -n "${{ inputs.body }}" ]; then
          CMD="$CMD --body '${{ inputs.body }}'"
        fi
        
        # Add prerelease flag
        if [ "${{ inputs.prerelease }}" = "true" ]; then
          CMD="$CMD --prerelease"
        fi
        
        # Add draft flag
        if [ "${{ inputs.draft }}" = "true" ]; then
          CMD="$CMD --draft"
        fi
        
        # Add file
        if [ -n "${{ inputs.file }}" ]; then
          CMD="$CMD --filename '${{ inputs.file }}'"
        fi
        
        # Add label
        if [ -n "${{ inputs.label }}" ]; then
          CMD="$CMD --label '${{ inputs.label }}'"
        fi

        CMD="$CMD -v"
        
        # Execute command
        echo "Executing: $CMD"
        eval $CMD
